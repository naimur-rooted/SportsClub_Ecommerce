<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="favRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#D63A2F"/>
    </linearGradient>
    <linearGradient id="favGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0A0A0A"/>

  <g transform="translate(18, 14)">
    <!-- Outer Shield -->
    <path d="M 46 2 
             C 74 2, 90 10, 90 10 
             L 90 52 
             C 90 76, 64 90, 46 96 
             C 28 90, 2 76, 2 52 
             L 2 10 
             C 2 10, 18 2, 46 2 Z" 
