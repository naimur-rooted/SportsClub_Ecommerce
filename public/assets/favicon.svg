          stroke="url(#favGoldGrad)" 
          stroke-width="3"/>

    <!-- Dynamic Crimson Slash -->
    <path d="M 2 34 L 26 12 L 90 56 L 90 74 L 68 88 Z" 
          fill="url(#favRedGrad)" 
          opacity="0.95"/>

    <!-- 'R' Monogram -->
    <rect x="29" y="26" width="9" height="46" rx="2" fill="#FFFFFF"/>
    <path d="M 38 26 L 56 26 C 65 26, 71 31, 71 39 C 71 47, 65 52, 56 52 L 38 52 Z" fill="#FFFFFF"/>
    <path d="M 38 33 L 53 33 C 58 33, 62 35.5, 62 39 C 62 42.5, 58 45, 53 45 L 38 45 Z" fill="#111111"/>
    <path d="M 48 50 L 68 72 L 56 72 L 40 52 Z" fill="#FFFFFF"/>
  </g>
</svg>
